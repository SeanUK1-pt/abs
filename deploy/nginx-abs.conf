# /etc/nginx/conf.d/abs.conf  --  algarveboatsales.com
#
# Differs from the previous file in three ways, all in the first server block:
#   1. an "upstream" listing both copies of the site (ports 3000 and 3100)
#   2. proxy_pass points at that upstream instead of 127.0.0.1:3000
#   3. proxy_next_upstream: if a copy refuses the connection (it is restarting),
#      nginx quietly tries the other copy for that same request.
# Everything else, including the Certbot-managed lines, is unchanged.

upstream abs_site {
    server 127.0.0.1:3000 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:3100 max_fails=1 fail_timeout=3s;
}

server {
    server_name sandbox.algarveboatsales.com algarveboatsales.com www.algarveboatsales.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://abs_site;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sandbox.algarveboatsales.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sandbox.algarveboatsales.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}
server {
    if ($host = www.algarveboatsales.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = algarveboatsales.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = sandbox.algarveboatsales.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name sandbox.algarveboatsales.com algarveboatsales.com www.algarveboatsales.com;
    return 404; # managed by Certbot






}
